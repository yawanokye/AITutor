databases:
  - name: ai-tutor-db
    plan: free
    databaseName: ai_tutor
    user: ai_tutor

services:
  - type: web
    name: anovlad-ai-tutor
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Anovlad AI Tutor
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.6-luna
      - key: TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: TTS_MODEL
        value: tts-1
      - key: DEFAULT_VOICE
        value: nova
      - key: DEMO_MODE
        value: false
      - key: ALLOW_GENERAL_KNOWLEDGE
        value: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tutor-db
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
