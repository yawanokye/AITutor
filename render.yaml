services:
  - type: web
    name: anovlad-ai-tutor
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Anovlad AI Tutor
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.6-luna
      - key: AI_REASONING_EFFORT
        value: low
      - key: AI_VERBOSITY
        value: medium
      - key: MAX_OUTPUT_TOKENS
        value: 6000
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: DEFAULT_VOICE
        value: nova
      - key: DEMO_MODE
        value: false
      - key: ALLOW_GENERAL_KNOWLEDGE
        value: true
      - key: ADMIN_KEY
        generateValue: true
      # Paste the Internal Database URL of your existing Render Postgres database.
      # This Blueprint deliberately does not create another database.
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
